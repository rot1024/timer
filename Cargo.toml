[workspace]
members = ["crates/timer-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/rot1024/timer"

[workspace.dependencies]
timer-core = { path = "crates/timer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
