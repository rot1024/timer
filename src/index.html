<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Timer</title>
    <link rel="stylesheet" href="./main.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <button id="remain" class="display" type="button">00:00:00</button>
      <input id="edit" class="display" type="text" spellcheck="false" autocomplete="off" hidden />
      <div class="progress"><div id="progress-value"></div></div>
      <div class="buttons">
        <button id="toggle" class="primary" type="button"></button>
        <button id="reset" class="secondary" type="button"></button>
      </div>
    </main>
  </body>
</html>
